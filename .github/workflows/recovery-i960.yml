name: recovery-i960

on:
  push:
    paths:
      - "tools/recovery/i960/**"
      - ".github/workflows/recovery-i960.yml"
  pull_request:
    paths:
      - "tools/recovery/i960/**"
      - ".github/workflows/recovery-i960.yml"

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S tools/recovery/i960 -B build/recovery-i960 -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/recovery-i960 --config Release

      - name: Test
        run: ctest --test-dir build/recovery-i960 -C Release --output-on-failure
